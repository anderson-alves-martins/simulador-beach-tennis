<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador de Beach Tennis</title>
<style>*{box-sizing:border-box}body{margin:0;background:#102b36;color:#fff;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}main{width:min(100%,720px)}h1{font-size:1.5rem}p{color:#d4e1e4}canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:14px;box-shadow:0 12px 30px #0005}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.team{padding:12px;border-radius:10px;background:#ffffff15}.team h2{font-size:1rem}.team label{display:block;margin:9px 0;font-size:.9rem}.team input{width:100%;padding:10px;border:0;border-radius:7px;font:inherit}button{margin:15px 0;padding:12px 18px;border:0;border-radius:9px;background:#f3ce77;font-weight:700;cursor:pointer}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0}.toolbar button{margin:0;padding:9px 12px}.toolbar button[aria-pressed="true"]{background:#74c6d7}.toolbar label{display:flex;align-items:center;gap:6px}.toolbar input{width:42px;height:35px;border:0;background:transparent}.toolbar{background:#173947;border:1px solid #42616d;border-radius:14px;padding:10px;gap:10px;box-shadow:0 8px 22px #0002}.toolgroup{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 8px;border:1px solid #ffffff20;border-radius:10px;flex:1 1 210px}.group-title{display:block;flex-basis:100%;font-size:10px;letter-spacing:.12em;color:#a8c3ce;font-weight:800}.toolbar button{background:#e5edf0;color:#163645;padding:9px 10px;font-size:12px;border-radius:8px}.toolbar button[aria-pressed="true"]{background:#f3ce77;color:#163645;outline:2px solid #fff}.toolbar label{font-size:12px}.toolbar input[type="range"]{width:75px;height:auto;accent-color:#f3ce77}.swatches{display:flex;gap:4px}.toolbar .swatch{width:24px;height:24px;min-width:24px;padding:0;border-radius:50%;background:var(--sw);border:2px solid #fff}.toolbar .swatch.selected{outline:2px solid #f3ce77;outline-offset:2px}@media(max-width:540px){.toolgroup{flex-basis:100%}.toolbar{gap:6px}.toolbar button{font-size:12px;padding:8px}} .actions-bottom{margin:12px 0 16px}.actions-bottom .toolgroup{flex-basis:100%;justify-content:center}.actions-bottom .group-title{text-align:center}
/* Beach Tennis Pro — identidade areia e mar, somente interface */
:root{color-scheme:light;--ocean:#075c83;--deep:#073b59;--sand:#f4c95d;--paper:#fffaf0}
body{display:block;background:linear-gradient(155deg,#e6f5f8 0%,#fff5d9 75%);color:var(--deep);padding:clamp(12px,3vw,28px)}
main{width:min(100%,760px);margin:0 auto}
h1{margin:8px 0;font-size:clamp(1.35rem,4vw,2rem);letter-spacing:-.035em;color:var(--deep)}
p{color:#416476;line-height:1.45;margin:8px 0 18px}
.toolbar{background:#fffdf7;border:1px solid #cce2e7;border-radius:18px;box-shadow:0 8px 24px #075c8312;padding:12px}
.toolgroup{border-color:#dcebf0;background:#f4f9f9;border-radius:12px}
.group-title{color:var(--ocean);font-size:11px;letter-spacing:.1em}
.toolbar button{background:#e2eff3;color:var(--deep);border:1px solid #c6dce3;border-radius:10px;min-height:40px;font-weight:700;transition:background .15s,transform .15s}
.toolbar button:active{transform:scale(.97)}
.toolbar button[aria-pressed="true"]{background:var(--sand);border-color:#d9a82c;color:#233b43;outline:2px solid #fff}
.toolbar input[type="range"]{accent-color:var(--ocean)}
.toolbar .swatch.selected{outline-color:var(--ocean)}
canvas{border:3px solid #fff;box-shadow:0 14px 32px #075c8325;border-radius:18px}
.actions-bottom .toolgroup{background:#fff8e4}
.actions-bottom button[id="save-image"],.actions-bottom button[id="share-image"]{background:var(--ocean);color:white;border-color:var(--ocean)}
section{gap:12px}
.team{background:#fffdf7;border:1px solid #d5e7e9;border-radius:16px;box-shadow:0 6px 18px #075c8310;color:var(--deep)}
.team input{background:#f3f8f8;border:1px solid #cddfe4;color:var(--deep);min-height:42px}
.team input:focus-visible,button:focus-visible{outline:3px solid #e6b63b;outline-offset:2px}
#reset{background:var(--sand);color:var(--deep);border:1px solid #d9a82c}
@media(max-width:540px){body{padding:10px}.toolbar{padding:8px}.toolgroup{padding:8px}.toolbar button{min-height:42px}.actions-bottom .toolgroup{justify-content:space-between}.actions-bottom button{flex:1 1 40%;font-size:12px}}

/* Ferramentas premium: ícones SVG consistentes e interação tátil */
.toolbar .toolgroup>button:not(.swatch){display:inline-flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;min-width:70px;min-height:70px;padding:9px 10px;border-radius:14px;background:linear-gradient(160deg,#ffffff,#dbeef4);border:1px solid #b9d5df;box-shadow:0 3px 0 #b5cfd7,0 6px 14px #075c8310;font-size:11px;line-height:1.15;transition:transform .16s,box-shadow .16s,background .16s}
.toolbar .toolgroup>button:not(.swatch) .tool-icon{display:block;width:25px;height:25px;flex-shrink:0}
.toolbar .toolgroup>button:not(.swatch)[aria-pressed="true"]{background:linear-gradient(160deg,#ffe69a,#f4c95d);border-color:#d6a72b;box-shadow:0 3px 0 #c89b26,0 5px 16px #d6a72b38;outline:2px solid #fff}
.toolbar .toolgroup>button:not(.swatch):active{transform:translateY(2px) scale(.98);box-shadow:0 1px 0 #b5cfd7}
.actions-bottom .toolgroup>button[id="save-image"],.actions-bottom .toolgroup>button[id="share-image"]{background:linear-gradient(160deg,#137fa5,#075c83);color:#fff;border-color:#075c83;box-shadow:0 3px 0 #043b56,0 6px 14px #075c8322}
@media(max-width:540px){.toolbar .toolgroup>button:not(.swatch){flex:1 1 70px;min-width:66px;min-height:68px;padding:8px 5px}.actions-bottom .toolgroup>button:not(.swatch){flex:1 1 40%;min-height:65px}}
@media(prefers-reduced-motion:reduce){.toolbar .toolgroup>button{transition:none!important}}
</style></head>
<body><main><h1>🎾 Simulador Tático de Beach Tennis</h1><p>Arraste os jogadores pelas laterais e pelo fundo. Cada dupla permanece do seu lado da rede.</p><div class="toolbar" role="toolbar" aria-label="Ferramentas táticas"><div class="toolgroup"><span class="group-title">MOVIMENTAÇÃO</span><button data-mode="move" aria-pressed="true"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V6a2 2 0 0 1 4 0v5-7a2 2 0 0 1 4 0v7-5a2 2 0 0 1 4 0v9c0 4-3 7-7 7h-2c-2 0-3-1-4-3l-3-5a2 2 0 0 1 3-2l1 1"/></svg><span>Mover</span></button></div><div class="toolgroup"><span class="group-title">DESENHO TÁTICO</span><button data-mode="pen" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 20 4-.8L20 7l-3-3L5 16zM15 6l3 3"/></svg><span>Caneta</span></button><button data-mode="line" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20 20 4"/><circle cx="4" cy="20" r="1"/><circle cx="20" cy="4" r="1"/></svg><span>Linha</span></button><button data-mode="dashed" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke-dasharray="3 4" d="M3 19 21 5"/></svg><span>Pontilhada</span></button><button data-mode="arrow" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18 20 6m-8 0h8v8"/></svg><span>Seta</span></button><button data-mode="curve" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19C3 5 13 5 20 8m-6-5 6 5-6 5"/></svg><span>Curva</span></button><button data-mode="eraser" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 15 10-11 8 8-8 9H9zM8 20h13"/></svg><span>Borracha</span></button></div><div class="toolgroup"><span class="group-title">TRAÇO</span><label>Cor <input id="ink" type="color" value="#1a3440"></label><div class="swatches"><button class="swatch" data-color="#1a3440" style="--sw:#1a3440" aria-label="Preto"></button><button class="swatch" data-color="#1979c7" style="--sw:#1979c7" aria-label="Azul"></button><button class="swatch" data-color="#dc4949" style="--sw:#dc4949" aria-label="Vermelho"></button><button class="swatch" data-color="#f5c431" style="--sw:#f5c431" aria-label="Amarelo"></button></div><label>Espessura <input id="weight" type="range" min="2" max="12" value="5"></label></div></div><canvas id="court" width="640" height="860"></canvas><div class="toolbar actions-bottom" role="group" aria-label="Ações da quadra"><div class="toolgroup"><span class="group-title">AÇÕES</span><button id="undo"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Desfazer</span></button><button id="clear"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/></svg><span>Limpar</span></button><button id="save-image"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3zm2 0v7h10V3M7 21v-8h10v8"/></svg><span>Salvar</span></button><button id="share-image"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M5 13v8h14v-8"/></svg><span>Compartilhar</span></button></div></div>
<section><div class="team"><h2>🔵 Quadra 1</h2><label>Jogador 1<input data-player="0" placeholder="Nome (opcional)"></label><label>Jogador 2<input data-player="1" placeholder="Nome (opcional)"></label></div><div class="team"><h2>🔴 Quadra 2</h2><label>Jogador 1<input data-player="2" placeholder="Nome (opcional)"></label><label>Jogador 2<input data-player="3" placeholder="Nome (opcional)"></label></div></section><button id="reset">Reiniciar posições</button></main>
<script>
const canvas=document.querySelector('#court'),ctx=canvas.getContext('2d');
const initial=[{x:210,y:190,n:1,side:'top',color:'#1979c7'},{x:430,y:190,n:2,side:'top',color:'#1979c7'},{x:210,y:670,n:1,side:'bottom',color:'#dc4949'},{x:430,y:670,n:2,side:'bottom',color:'#dc4949'}];
let players=initial.map(p=>({...p})),ball={x:320,y:600},drag=null,active=null,mode='move';const names=['','','',''],strokes=[];const ink=document.querySelector('#ink'),weight=document.querySelector('#weight');document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{ink.value=b.dataset.color;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x===b))}));ink.addEventListener('input',()=>document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('selected',b.dataset.color===ink.value)));
const sandLayer=document.createElement('canvas');sandLayer.width=640;sandLayer.height=860;const sandCtx=sandLayer.getContext('2d');

const sand=sandCtx.createLinearGradient(0,0,640,860);sand.addColorStop(0,'#dfc08b');sand.addColorStop(.52,'#cfa66e');sand.addColorStop(1,'#e3c48d');sandCtx.fillStyle=sand;sandCtx.fillRect(0,0,640,860);const courtSand=sandCtx.createLinearGradient(70,65,570,795);courtSand.addColorStop(0,'#f3d8a4');courtSand.addColorStop(.5,'#e7c48b');courtSand.addColorStop(1,'#f1d19a');sandCtx.fillStyle=courtSand;sandCtx.fillRect(70,65,500,730);sandCtx.save();sandCtx.globalAlpha=.12;for(let i=0;i<1800;i++){const x=(i*97.37)%640,y=(i*61.71)%860;sandCtx.fillStyle=i%3?'#a98152':'#fff8e5';sandCtx.fillRect(x,y,2+(i%3),1+(i%2))}sandCtx.restore();

function draw(){ctx.drawImage(sandLayer,0,0);
ctx.strokeStyle='#fffdf5';ctx.lineWidth=7;ctx.strokeRect(80,75,480,710);
ctx.fillStyle='#33434a';ctx.fillRect(72,418,496,24);ctx.strokeStyle='#dfe8e9';ctx.lineWidth=2;for(let x=80;x<=560;x+=18){ctx.beginPath();ctx.moveTo(x,420);ctx.lineTo(x,440);ctx.stroke()}
// Dois minicons em cada lateral de cada meia quadra: três zonas iguais em profundidade.
function cone(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#fa7a21';ctx.strokeStyle='#fff8e9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(-10,9);ctx.lineTo(10,9);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff8e9';ctx.fillRect(-5,2,10,3);ctx.fillStyle='#c45415';ctx.fillRect(-12,9,24,4);ctx.restore()}
for(const [start,end] of [[75,420],[440,785]]){for(let i=1;i<=2;i++){const y=start+(end-start)*i/3;cone(59,y);cone(581,y)}}
ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 19px system-ui';ctx.fillStyle='#23424b';
[...strokes,...(active?[active]:[])].forEach(st=>{const pts=st.points;if(!pts.length)return;ctx.save();ctx.strokeStyle=st.color;ctx.fillStyle=st.color;ctx.lineWidth=st.width||5;ctx.lineCap='round';ctx.lineJoin='round';if(st.type==='dashed')ctx.setLineDash([13,10]);ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);if(st.type==='curve'&&pts.length>2){const a=pts[0],c=pts[1],b=pts[2];ctx.quadraticCurveTo(c.x,c.y,b.x,b.y)}else for(const p of pts.slice(1))ctx.lineTo(p.x,p.y);if(pts.length===1)ctx.lineTo(pts[0].x+.1,pts[0].y+.1);ctx.stroke();if(['arrow','curve'].includes(st.type)&&pts.length>1){ctx.setLineDash([]);const b=pts[pts.length-1],a=st.type==='curve'&&pts.length>2?pts[1]:pts[pts.length-2],ang=Math.atan2(b.y-a.y,b.x-a.x),len=19;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-len*Math.cos(ang-.55),b.y-len*Math.sin(ang-.55));ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-len*Math.cos(ang+.55),b.y-len*Math.sin(ang+.55));ctx.stroke()}ctx.restore()});ctx.beginPath();ctx.arc(ball.x,ball.y,12,0,Math.PI*2);ctx.fillStyle='#e9ed48';ctx.fill();ctx.strokeStyle='#fdfdfd';ctx.lineWidth=2.5;ctx.stroke();ctx.beginPath();ctx.arc(ball.x-3,ball.y,6,-1.3,1.3);ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.stroke();players.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,24,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.fillText(p.n,p.x,p.y);if(names[i]){ctx.font='bold 16px system-ui';ctx.fillStyle='#20333a';ctx.fillText(names[i],p.x,p.y+40)}})}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*640/r.width,y:(e.clientY-r.top)*860/r.height}}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)))}));
canvas.addEventListener('pointerdown',e=>{const q=point(e);if(mode==='move'){drag=Math.hypot(ball.x-q.x,ball.y-q.y)<22?ball:([...players].reverse().find(p=>Math.hypot(p.x-q.x,p.y-q.y)<35)||null);if(!drag)return}else if(mode==='eraser'){let idx=-1,dist=24;strokes.forEach((st,i)=>{for(const p of st.points){const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<dist){dist=d;idx=i}}});if(idx>=0)strokes.splice(idx,1);draw();return}else active={type:mode,color:ink.value,width:Number(weight.value),points:[q]};canvas.setPointerCapture(e.pointerId);draw()});
canvas.addEventListener('pointermove',e=>{if(!drag&&!active)return;const q=point(e);if(drag){drag.x=Math.max(16,Math.min(624,q.x));drag.y=drag===ball?Math.max(16,Math.min(844,q.y)):(drag.side==='top'?Math.max(26,Math.min(395,q.y)):Math.max(465,Math.min(834,q.y)))}else if(active){if(['arrow','line','dashed'].includes(active.type))active.points=[active.points[0],q];else if(active.type==='curve'){const a=active.points[0],mid={x:(a.x+q.x)/2,y:(a.y+q.y)/2-65};active.points=[a,mid,q]}else active.points.push(q)}draw()});
function finish(){if(active){strokes.push(active);active=null}drag=null;draw()}
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,finish);
document.querySelector('#undo').addEventListener('click',()=>{strokes.pop();draw()});
document.querySelector('#clear').addEventListener('click',()=>{strokes.length=0;draw()});
document.querySelectorAll('[data-player]').forEach(input=>input.addEventListener('input',()=>{names[Number(input.dataset.player)]=input.value.trim();draw()}));
function captureBlob(){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Falha ao capturar a quadra')),'image/png'))}
function downloadBlob(blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='quadra-beach-tennis.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelector('#save-image').addEventListener('click',async()=>{try{downloadBlob(await captureBlob())}catch(e){alert('Não foi possível salvar a imagem.')}});
document.querySelector('#share-image').addEventListener('click',async()=>{try{const blob=await captureBlob(),file=new File([blob],'quadra-beach-tennis.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'Jogada de Beach Tennis'})}catch(e){if(e.name!=='AbortError')downloadBlob(blob)}}else{downloadBlob(blob);alert('Seu navegador não permite compartilhar a imagem diretamente. Ela foi salva para você enviar.')}}catch(e){alert('Não foi possível capturar a quadra.')}});
document.querySelector('#reset').addEventListener('click',()=>{players=initial.map(p=>({...p}));draw()});draw();
</script></body></html>
