<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="styles.css"><title>Prancheta Tática de Beach Tennis</title>
</head>
<body><main><header class="app-header"><img class="brand-logo" src="assets/prancheta-tatica-header.png" alt="Prancheta Tática de Beach Tennis"><p>Arraste os jogadores pelas laterais e pelo fundo. Cada dupla permanece do seu lado da rede.</p></header><div class="toolbar" role="toolbar" aria-label="Ferramentas táticas"><div class="toolgroup drawing-tools"><span class="group-title">DESENHO TÁTICO</span><button data-mode="pen" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 20 4-.8L20 7l-3-3L5 16zM15 6l3 3"/></svg><span>Caneta</span></button><button data-mode="line" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20 20 4"/><circle cx="4" cy="20" r="1"/><circle cx="20" cy="4" r="1"/></svg><span>Linha</span></button><button data-mode="dashed" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke-dasharray="3 4" d="M3 19 21 5"/></svg><span>Pontilhada</span></button><button data-mode="arrow" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18 20 6m-8 0h8v8"/></svg><span>Seta</span></button><button data-mode="curve" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19C3 5 13 5 20 8m-6-5 6 5-6 5"/></svg><span>Curva</span></button><button data-mode="eraser" aria-pressed="false"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 15 10-11 8 8-8 9H9zM8 20h13"/></svg><span>Borracha</span></button></div><div class="settings-row"><div class="toolgroup trace-group"><span class="group-title">TRAÇO</span><label>Cor <input id="ink" type="color" value="#1a3440"></label><div class="swatches"><button class="swatch" data-color="#1a3440" aria-label="Preto"></button><button class="swatch" data-color="#1979c7" aria-label="Azul"></button><button class="swatch" data-color="#dc4949" aria-label="Vermelho"></button><button class="swatch" data-color="#f5c431" aria-label="Amarelo"></button></div><label>Espessura <input id="weight" type="range" min="2" max="12" value="5"></label></div><div class="toolgroup movement-group"><span class="group-title">MOVIMENTAÇÃO</span><button data-mode="move" aria-pressed="true"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V6a2 2 0 0 1 4 0v5-7a2 2 0 0 1 4 0v7-5a2 2 0 0 1 4 0v9c0 4-3 7-7 7h-2c-2 0-3-1-4-3l-3-5a2 2 0 0 1 3-2l1 1"/></svg><span>Mover</span></button></div></div></div><canvas id="court" width="640" height="860"></canvas><div class="toolbar actions-bottom" role="group" aria-label="Ações da quadra"><div class="toolgroup"><span class="group-title">AÇÕES</span><button id="undo"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Desfazer</span></button><button id="clear"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/></svg><span>Limpar</span></button><button id="save-image"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3zm2 0v7h10V3M7 21v-8h10v8"/></svg><span>Salvar</span></button><button id="share-image"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M5 13v8h14v-8"/></svg><span>Compartilhar</span></button></div></div>
<section><div class="team"><h2>🔵 Quadra 1</h2><label>Jogador 1<input data-player="0" maxlength="40" placeholder="Nome (opcional)"></label><label>Jogador 2<input data-player="1" maxlength="40" placeholder="Nome (opcional)"></label></div><div class="team"><h2>🔴 Quadra 2</h2><label>Jogador 1<input data-player="2" maxlength="40" placeholder="Nome (opcional)"></label><label>Jogador 2<input data-player="3" maxlength="40" placeholder="Nome (opcional)"></label></div></section><button id="reset">Reiniciar posições</button></main>
<script src="app.js" defer></script></body></html>
